name: Pemeriksaan Aplikasi

on:
  push:
    branches: [local, develop, staging, main, master]
  pull_request:
    branches: [local, develop, staging, main, master]

permissions:
  contents: read

jobs:
  laravel:
    name: Test dan Pint Laravel
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: sistem_pergudangan_laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:VGVzdE9ubHlBcHBsaWNhdGlvbktleUZvckNJLTIwMjY=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sistem_pergudangan_laravel_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Siapkan skema database pengujian
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $pdo = new PDO('mysql:host=127.0.0.1;port=3306', 'root', '', [
              PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
          ]);
          $sql = str_replace(
              'sistem_pergudangan',
              'sistem_pergudangan_laravel_test',
              file_get_contents('database.sql')
          );
          foreach (preg_split('/;\\s*(?:\\r?\\n|$)/', $sql) as $statement) {
              $statement = trim($statement);
              if ($statement !== '') {
                  $pdo->exec($statement);
              }
          }
          PHP
          php artisan migrate --path=database/migrations/2026_10_07_000002_create_purchasing_notifications_table.php --force
          php artisan migrate --path=database/migrations/2026_10_07_000003_create_warehouse_notifications_table.php --force
          php artisan migrate --path=database/migrations/2026_10_09_000001_create_warehouse_activity_tables.php --force
      - name: Jalankan Laravel Pint pada PHP yang berubah
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" -- '*.php')"
          else
            changed_files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.php')"
          fi
          if [[ -z "$changed_files" ]]; then
            echo "Tidak ada file PHP yang berubah; pemeriksaan Pint dilewati."
            exit 0
          fi
          mapfile -t php_files <<< "$changed_files"
          vendor/bin/pint --test "${php_files[@]}"
      - name: Jalankan test Laravel
        run: php artisan test

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pasang dependensi Playwright
        run: npm ci
      - name: Pasang browser Chromium
        run: npx playwright install --with-deps chromium
      - name: Jalankan server Laravel di loopback dan tunggu kesiapan
        shell: bash
        run: |
          set -euo pipefail
          nohup php artisan serve --host=127.0.0.1 --port=8001 > /tmp/laravel-e2e.log 2>&1 &
          echo $! > /tmp/laravel-e2e.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/login.php > /dev/null; then
              echo "Laravel siap di loopback setelah percobaan ke-${attempt}."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/laravel-e2e.log
          exit 1
      - name: Jalankan tes Playwright
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:8001
        run: npx playwright test
      - name: Unggah laporan Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
