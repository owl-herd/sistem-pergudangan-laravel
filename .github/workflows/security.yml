name: Security

on:
  pull_request:
    branches: [local, develop, staging, main, master]
  push:
    branches: [local, develop, staging, main, master]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sensitive-file-guard:
    name: Sensitive file guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout riwayat
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tolak file sensitif pada perubahan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")"
          fi
          forbidden='(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks|crt|cer)$|storage/app/private/|secrets?/|credentials?/)(|.*)$'
          blocked="$(printf '%s\n' "$changed_files" | grep -Ei "$forbidden" | grep -Ev '^\.env\.example$' || true)"
          if [[ -n "$blocked" ]]; then
            echo "Perubahan mengandung file sensitif yang dilarang:"
            echo "$blocked"
            exit 1
          fi
          echo "Tidak ada file sensitif terlarang pada perubahan ini."

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Scan keamanan Semgrep
        run: >-
          semgrep scan
          --config p/default
          --config p/secrets
          --error
          --exclude vendor
          --exclude node_modules

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Inisialisasi CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Analisis CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
